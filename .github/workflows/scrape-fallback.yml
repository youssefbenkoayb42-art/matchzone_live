name: MatchZone fallback scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scrape football fallback
        run: npm run scrape:fallback
        env:
          SCRAPER_USER_AGENT: "MatchZone/1.0 (+https://matchzone-live.vercel.app/)"

      - name: Commit datastore when changed
        run: |
          git config user.name "matchzone-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scraped-matches.json
          if git diff --cached --quiet; then
            echo "No scraper changes."
            exit 0
          fi
          git commit -m "Update MatchZone fallback match data"
          git push
