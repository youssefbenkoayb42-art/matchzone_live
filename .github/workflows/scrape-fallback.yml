name: MatchZone fallback scraper

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/scrape-fallback.mjs"
      - "scripts/package.json"
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install scraper dependencies
        run: npm install --prefix scripts --no-package-lock

      - name: Install Chromium for Playwright
        run: cd scripts && npx playwright install --with-deps chromium

      - name: Scrape football fallback
        run: node scripts/scrape-fallback.mjs
        env:
          SCRAPER_USER_AGENT: "MatchZone/1.0 (+https://matchzone-live.vercel.app/)"

      - name: Commit datastore when changed
        run: |
          git config user.name "matchzone-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scraped-matches.json public/teams
          if git diff --cached --quiet; then
            echo "No scraper changes."
            exit 0
          fi
          git commit -m "Update MatchZone fallback match data"

          # The scraper can run while another GitHub commit lands on main.
          # Rebase on the latest main before pushing to avoid non-fast-forward failures.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done

          echo "Could not push scraper update after 3 attempts."
          exit 1
