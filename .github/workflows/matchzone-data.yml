name: MatchZone clean football data

concurrency:
  group: matchzone-clean-data
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/scrape.mjs"
      - "scripts/package.json"
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify API secret
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          test -n "$FOOTBALL_DATA_API_KEY" || {
            echo "FOOTBALL_DATA_API_KEY is missing."
            exit 1
          }

      - name: Run clean scraper
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/scrape.mjs

      - name: Remove legacy artifacts
        run: |
          rm -rf public/teams
          rm -f data/team-logo-registry.json
          rm -f scripts/scrape-fallback.mjs
          rm -f docs/fallback-scraper.md
          rm -f lib/fallback-matches.js

      - name: Commit clean datastore
        run: |
          git config user.name "matchzone-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          echo "Clean sync:"
          git status --short
          git diff --cached --name-status
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update free multi-source football snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Push failed after 3 attempts."
          exit 1
